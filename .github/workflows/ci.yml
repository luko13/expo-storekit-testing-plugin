name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.4, 22.x, 24.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit package tarball
        run: npm run pack:audit

  prebuild:
    name: Expo SDK ${{ matrix.expo }} prebuild
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        expo: ['54', '55', '56', '57']
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tarball used by the example
        run: npm pack --pack-destination example

      - name: Verify prebuild lifecycle
        run: node scripts/verify-example-prebuild.js --sdk ${{ matrix.expo }}

  apple-validation:
    name: StoreKit and Xcode validation
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tarball used by the example
        run: npm pack --pack-destination example

      - name: Generate verified iOS project
        run: >-
          node scripts/verify-example-prebuild.js
          --sdk 57
          --workspace .integration/storekit-sdk-57
          --keep

      - name: Validate StoreKit catalog
        env:
          STOREKIT_FILE: ${{ github.workspace }}/.integration/storekit-sdk-57/storekit/Configuration.storekit
        run: >-
          xcrun swift -e
          'import Foundation; import StoreKitTest;
          let path = ProcessInfo.processInfo.environment["STOREKIT_FILE"]!;
          _ = try SKTestSession(contentsOf: URL(fileURLWithPath: path));
          print("StoreKit catalog loaded successfully.")'

      - name: Validate Xcode project and shared scheme
        working-directory: .integration/storekit-sdk-57
        run: |
          xcodebuild -list -project ios/StoreKitTestingExample.xcodeproj
          xcodebuild \
            -project ios/StoreKitTestingExample.xcodeproj \
            -scheme StoreKitTestingExample \
            -showBuildSettings > /dev/null
